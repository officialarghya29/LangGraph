[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-multi-agent"
version = "0.1.0"
description = "Production-oriented LangGraph multi-agent orchestration system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Proprietary. All rights reserved to the author; see LICENSE.
license = { file = "LICENSE" }
authors = [{ name = "Arghya Bose", email = "officialarghya29@gmail.com" }]

# Direct dependencies are pinned to the exact versions resolved and tested
# against Python 3.12 on the development machine. The full transitive set is
# recorded in docs/TECH_STACK.md.
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
    # Durable task, approval, memory, and checkpoint storage. `asyncpg` is the
    # driver behind the `postgresql+asyncpg` scheme the engine builder requires;
    # it is named explicitly rather than left to the dialect, because a missing
    # driver is a startup failure, not an optional feature.
    "sqlalchemy==2.1.1",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    # The durable checkpointer. Its separate distribution is what makes a run
    # survive a restart, so it is a runtime dependency, not a test one.
    "langgraph-checkpoint-postgres==3.1.2",
    # The `binary` extra ships a bundled libpq; a system libpq is not something
    # this project can assume, and without one psycopg refuses to import.
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    # Rate-limit counters and the cache.
    "redis==8.1.0",
    # Bearer-token verification.
    "pyjwt==2.15.0",
]

[project.optional-dependencies]
dev = [
    # Starlette 1.7's TestClient uses httpx2; plain httpx is deprecated here.
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    # The test suites import psycopg directly, to read a committed row over a
    # connection the application did not open.
    "psycopg[binary]==3.3.6",
]
assets = [
    # Only needed to regenerate the diagrams in docs/assets/.
    "pillow==12.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "RUF",   # Ruff-specific
    "D",     # pydocstyle
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "D107",   # constructor semantics are documented by the class docstring
]

[tool.ruff.lint.isort]
# Stated explicitly rather than inferred: without it, ruff cannot tell that
# `app` is this project, and every module that imports it gets sorted as though
# the dependency came from PyPI.
known-first-party = ["app", "tests", "migrations"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test doubles use obvious placeholder values (which trip the secret heuristics)
# and are not a public API, so their docstrings are not enforced.
"tests/**" = [
    "S101", # asserts are the assertions in a test
    "S105", # obvious placeholder credential values
    "S106",
    "S107",
    "D100", # tests are not a public API, so docstrings are not enforced
    "D101",
    "D102",
    "D103",
    "S608", # allows "SELECT count(*) FROM {table}" over a fixed tuple of
    #         literal table names, which is not user input
]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. An async database engine pools
# connections bound to the loop that created them, so a session-scoped engine
# used from a per-test loop fails with "attached to a different loop". Sharing
# the loop keeps the fixture scopes and the engine's lifetime consistent.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external services (PostgreSQL, Redis)",
    "evaluation: benchmark and quality evaluation cases",
]
