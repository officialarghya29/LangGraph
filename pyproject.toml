[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langgraph-multi-agent"
version = "0.1.0"
description = "Production-oriented LangGraph multi-agent orchestration system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Proprietary. All rights reserved to the author; see LICENSE.
license = { file = "LICENSE" }
authors = [{ name = "Arghya Bose", email = "officialarghya29@gmail.com" }]

# Direct dependencies are pinned to the exact versions resolved and tested
# against Python 3.12 on the development machine. The full transitive set is
# recorded in docs/TECH_STACK.md.
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    # Starlette 1.7's TestClient uses httpx2; plain httpx is deprecated here.
    "httpx2==2.13.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]
assets = [
    # Only needed to regenerate the diagrams in docs/assets/.
    "pillow==12.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "RUF",   # Ruff-specific
    "D",     # pydocstyle
]
ignore = [
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D103", "D100"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires external services (PostgreSQL, Redis)",
    "evaluation: benchmark and quality evaluation cases",
]
