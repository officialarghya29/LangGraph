# Alembic configuration.
#
# The database URL is deliberately absent. It is read from the application's
# typed settings layer in migrations/env.py, so there is exactly one place a
# connection string is defined and no credential is ever written into this file.

[alembic]
script_location = migrations
prepend_sys_path = .

# Migration filenames carry a timestamp so they sort chronologically regardless
# of clock or author, and a slug so a review can see what each one does.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Split prepend_sys_path on the OS path separator. Without this, Alembic falls
# back to legacy splitting on spaces, commas, and colons, which breaks on a path
# that contains a space — such as this project's.
path_separator = os
version_path_separator = os

# Compare types so that a change from String(32) to String(64) is detected
# rather than silently ignored.
compare_type = true
compare_server_default = true

[post_write_hooks]
# Nothing is hooked here on purpose: generated migrations are reviewed and
# formatted by the same ruff run as the rest of the source.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
